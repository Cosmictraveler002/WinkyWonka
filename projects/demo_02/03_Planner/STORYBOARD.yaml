rhythm_template: Template D (3:2:1)
creative_direction:
  core_idea: High-impact authored visual narrative balancing kinetic typography,
    deep atmospheric lighting, and high-fidelity product reveals built around
    Template D (3:2:1).
  visual_language: Grounded editorial dark mode aesthetic, avoiding generic
    AI-slop tropes. High contrast between crisp foreground typographic marks and
    subtle volumetric particle fields.
  camera_language: Deliberate, cinematic focal shifts with subtle continuous
    drift. Fast snaps on rhythmic accents, stable holds on key typography and
    payoff.
  editing_language: Non-uniform temporal cutting following Template D (3:2:1).
    Opening burst (2.5s) -> fast technical escalation (1.8s) -> extended payoff
    hold (3.0s). Cuts are motivated by typographic reveals rather than arbitrary
    beats.
  performance_language: "Zero mechanical float. Elements settle with organic
    spring physics (damping: 15, stiffness: 220), establishing weight and
    tactile authority."
  typography_language: Dominant uppercase display headings with generous
    letter-spacing, accompanied by muted geometric mono captions. Clear
    typographical hierarchy.
  ending_strategy: Decisive focal settlement on brand call-to-action with glowing
    accent pulse, holding until visual dissolve.
  major_creative_decisions:
    - id: D001
      topic: Hero Subject Presentation in Scene 02
      proposed_direction: Floating 3D glass card with subtle particle orbit and kinetic text reveal
      alternatives:
        - Direct full-screen product hero shot with dynamic camera push-in
        - Split-screen typographic showcase comparing features side-by-side
      requires_human_choice: true
      status: pending
    - id: D002
      topic: Transition from Scene 01 to Scene 02
      proposed_direction: Rapid slide left with motion blur to maintain kinetic acceleration
      alternatives:
        - Hard cut on audio transient for maximum contrast
        - Dimensional zoom-through camera match cut
      requires_human_choice: false
      status: approved
    - id: D003
      topic: Closing Call-to-Action Payoff
      proposed_direction: GlowBadge with pulsing cyan border and animated button settlement
      alternatives:
        - Minimalist centered monochrome logo reveal without button UI
        - Fast kinetic wordmark slam followed by URL lockup
      requires_human_choice: true
      status: pending
